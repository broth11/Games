<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Double Blind — Review Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --paper:#FFFFFF; --card:#FFFFFF; --card-2:#F1F1F1; --ink:#121212; --ink-soft:#5C5C5C;
    --rule:#D6D6D6; --flag:#D8433E; --flag-ink:#FBEAE9; --wire:#121212; --wire-ink:#EDEDED;
    --focus:#121212; --shadow: 0 1px 0 rgba(0,0,0,0.06), 0 8px 20px -12px rgba(0,0,0,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0A0A0A; --card:#161616; --card-2:#212121; --ink:#F2F2F2; --ink-soft:#A6A6A6;
      --rule:#333333; --flag:#E8615C; --flag-ink:#2A1210; --wire:#F2F2F2; --wire-ink:#262626; --focus:#F2F2F2;
      --shadow: 0 1px 0 rgba(0,0,0,0.4), 0 12px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0A0A0A; --card:#161616; --card-2:#212121; --ink:#F2F2F2; --ink-soft:#A6A6A6;
    --rule:#333333; --flag:#E8615C; --flag-ink:#2A1210; --wire:#F2F2F2; --wire-ink:#262626; --focus:#F2F2F2;
    --shadow: 0 1px 0 rgba(0,0,0,0.4), 0 12px 28px -14px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{ background: radial-gradient(circle at 1px 1px, var(--rule) 1px, transparent 0) 0 0/16px 16px, var(--paper);
    color:var(--ink); font-family:"IBM Plex Sans",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  .mono{font-family:"IBM Plex Mono","SF Mono",monospace; font-variant-numeric:tabular-nums;}
  a{color:inherit;} button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--focus); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
  .wrap{max-width:820px; margin:0 auto; padding:28px 18px 60px;}
  .masthead{text-align:center; margin-bottom:22px;}
  .kicker{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;}
  .nameplate{font-family:"Cormorant",serif; font-weight:600; font-size:clamp(34px,7vw,52px); line-height:0.9; letter-spacing:0.01em; text-transform:uppercase; text-wrap:balance; margin:0;}
  .nameplate em{font-style:normal; color:var(--flag);}
  .brand-logo{display:block; margin:0 auto; width:100%; max-width:220px; height:auto;}
  .dateline{display:flex; justify-content:space-between; align-items:center; border-top:2px solid var(--ink); border-bottom:1px solid var(--rule); padding:6px 2px; margin-top:10px; font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .card{background:var(--card); border:1px solid var(--rule); border-radius:3px; box-shadow:var(--shadow); padding:20px 20px 22px;}
  .stack > * + *{margin-top:16px;}
  .eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 10px;}
  h2.section-title{font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:24px; letter-spacing:.01em; text-transform:uppercase; margin:0 0 4px; text-wrap:balance;}
  p{line-height:1.5;}
  label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:6px;}
  input[type=number]{width:100%; padding:12px 12px; border-radius:3px; border:1.5px solid var(--rule); background:var(--card-2); color:var(--ink); font-size:16px; font-family:inherit;}
  input[type=number]:focus{border-color:var(--focus);}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px 18px; border-radius:3px; border:none; cursor:pointer; font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:19px; letter-spacing:.03em; text-transform:uppercase; background:var(--ink); color:var(--paper); transition:transform .08s ease;}
  .btn:active{transform:scale(0.98);} .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-flag{background:var(--flag); color:var(--flag-ink);}
  .btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--rule);}
  .btn-sm{padding:9px 14px; font-size:14px;}
  .err{color:var(--flag); font-size:13px; margin-top:8px; min-height:16px;}
  .code-input{text-transform:uppercase; text-align:center; letter-spacing:.3em; font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:22px !important;}
  .link-quiet{background:none; border:none; color:var(--ink-soft); font-family:"IBM Plex Mono",monospace; font-size:12px; text-decoration:underline; cursor:pointer; padding:6px 0;}
  .link-quiet i{font-size:0.95em; margin-right:6px;}
  .music-credit{margin-top:10px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--ink-soft); line-height:1.4; text-align:center;}
  table.lb{width:100%; border-collapse:collapse; margin-top:14px; font-size:14px;}
  table.lb th{text-align:left; font-family:"IBM Plex Mono",monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); padding:0 6px 8px; border-bottom:2px solid var(--ink);}
  table.lb td{padding:9px 6px; border-bottom:1px solid var(--rule); vertical-align:middle;}
  table.lb td.num, table.lb th.num{font-family:"IBM Plex Mono",monospace; text-align:right; font-variant-numeric:tabular-nums;}
  .rank-badge{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600; background:var(--card-2); color:var(--ink-soft);}
  .rank-badge.top{background:var(--flag); color:var(--flag-ink);}
  .lb-empty{padding:30px 10px; text-align:center; color:var(--ink-soft); font-size:14px;}
  .backlink{display:inline-block; margin-bottom:14px; font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft); text-decoration:none; cursor:pointer; background:none; border:none; padding:0;}
  .reset-box{margin-top:10px; display:flex; gap:8px;} .reset-box input{flex:1; padding:12px; border-radius:3px; border:1.5px solid var(--rule); background:var(--card-2); color:var(--ink);}
  .phase-pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; font-family:"IBM Plex Mono",monospace; font-size:11px; text-transform:uppercase; letter-spacing:.07em; border:1px solid var(--rule); color:var(--ink-soft);}
  .phase-pill.live{background:var(--wire-ink); color:var(--wire); border-color:var(--wire);}
  .phase-pill.countdown{background:var(--flag-ink); color:var(--flag); border-color:var(--flag);}
  .phase-pill.ended{background:var(--card-2); color:var(--ink-soft);}
  .host-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .host-top-right{display:flex; align-items:center; gap:8px;}
  .mute-btn{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; border:1px solid var(--rule); background:var(--card-2); color:var(--ink-soft); font-family:"IBM Plex Mono",monospace; font-size:11px; text-transform:uppercase; letter-spacing:.07em; cursor:pointer;}
  .mute-btn.muted{border-color:var(--flag); color:var(--flag); background:var(--flag-ink);}
  .big-clock{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:56px; text-align:center; letter-spacing:.02em; margin:10px 0 2px;}
  .preset-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .preset-chip{padding:7px 14px; border-radius:20px; border:1.5px solid var(--rule); background:var(--card-2); color:var(--ink); font-family:"IBM Plex Mono",monospace; font-size:12.5px; cursor:pointer;}
  .preset-chip.active{border-color:var(--flag); color:var(--flag); background:var(--flag-ink);}
  .joined-note{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--ink-soft); text-align:center; margin-top:6px;}
  .host-note{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .game-code-display{font-family:"IBM Plex Mono",monospace; font-weight:600; letter-spacing:.22em; font-size:clamp(46px,13vw,80px); line-height:1; color:var(--flag); margin:6px 0 2px;}
  .waiting-list{display:grid; gap:8px; margin-top:14px;}
  .waiting-row{display:flex; justify-content:space-between; gap:12px; padding:9px 10px; border:1px solid var(--rule); background:var(--card-2); border-radius:3px;}
  .waiting-row .period{font-family:"IBM Plex Mono",monospace; color:var(--ink-soft); font-size:12px; white-space:nowrap;}
  .dashboard-grid{display:grid; grid-template-columns:minmax(0,1fr); gap:16px;}
  .dashboard-grid .masthead{margin:0;}
  .host-utility-links{text-align:center; margin-top:16px; padding-top:12px; border-top:1px solid var(--rule);}
  @media (min-width:900px){
    .wrap{max-width:1180px; padding:32px 28px 60px;}
    .dashboard-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px;}
    .dashboard-grid .masthead{align-self:center;}
  }

  /* ================= RESULTS CUTSCENE ================= */
  .results-stage{background:#0A0A0A; color:#F5F5F5; border-radius:8px; padding:36px 24px 30px; text-align:center;}
  .results-kicker{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.2em; text-transform:uppercase; opacity:.6; margin-bottom:6px;}
  .results-title{font-family:"Big Shoulders Display",sans-serif; font-weight:900; font-size:clamp(30px,6vw,44px); text-transform:uppercase; margin:0 0 26px;}
  .podium{display:flex; align-items:flex-end; justify-content:center; gap:14px; margin-bottom:30px;}
  .podium-slot{display:flex; flex-direction:column; align-items:center; gap:8px; width:120px; animation:riseIn .5s cubic-bezier(.2,.8,.3,1) both;}
  .podium-slot:nth-child(1){animation-delay:.05s;}
  .podium-slot:nth-child(2){animation-delay:.35s;}
  .podium-slot:nth-child(3){animation-delay:.2s;}
  @keyframes riseIn{ from{opacity:0; transform:translateY(26px);} to{opacity:1; transform:translateY(0);} }
  .podium-slot .p-name{font-weight:700; font-size:14px; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .podium-slot .p-score{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:15px; color:var(--flag);}
  .podium-bar{width:100%; border-radius:6px 6px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:8px; font-family:"Big Shoulders Display",sans-serif; font-weight:900; font-size:26px;}
  .podium-slot.rank-1 .podium-bar{height:120px; background:var(--flag); color:#F5F5F5;}
  .podium-slot.rank-2 .podium-bar{height:90px; background:#B0B0B0; color:#0A0A0A;}
  .podium-slot.rank-3 .podium-bar{height:66px; background:#5A5A5A; color:#F5F5F5;}
  .results-rest{max-width:420px; margin:0 auto; text-align:left; animation:riseIn .5s ease-out .5s both;}
  .results-row{display:flex; justify-content:space-between; padding:7px 4px; border-bottom:1px solid rgba(246,241,228,0.15); font-size:14px;}
  .results-row .r-rank{font-family:"IBM Plex Mono",monospace; opacity:.55; width:26px; flex:none;}
  .results-row .r-score{font-family:"IBM Plex Mono",monospace; font-weight:600;}
  .results-empty{opacity:.6; padding:20px 0; font-family:"IBM Plex Mono",monospace; font-size:13px;}

  /* ---- TABULATING ---- */
  .tally{padding:40px 20px 34px; text-align:center;}
  .tally-num{font-family:"Big Shoulders Display",sans-serif; font-weight:900; font-size:clamp(56px,13vw,104px); line-height:1; color:var(--flag); font-variant-numeric:tabular-nums;}
  .tally-cap{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.18em; text-transform:uppercase; opacity:.45; margin-top:2px;}
  .tally-label{font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.22em; text-transform:uppercase; opacity:.6; margin-top:18px; min-height:16px;}
  .tally-wire{max-width:340px; margin:20px auto 0; height:3px; background:rgba(246,241,228,0.14); border-radius:2px; overflow:hidden;}
  .tally-wire span{display:block; height:100%; width:38%; background:var(--flag); border-radius:2px; animation:wireRun 1.15s ease-in-out infinite;}
  @keyframes wireRun{ 0%{transform:translateX(-110%);} 100%{transform:translateX(320%);} }

  /* ================= HISTORY ================= */
  .history-tabs{display:flex; gap:8px; margin-bottom:4px; flex-wrap:wrap;}
  .tab-btn{padding:8px 14px; border-radius:20px; border:1.5px solid var(--rule); background:var(--card-2); color:var(--ink-soft); font-family:"IBM Plex Mono",monospace; font-size:12.5px; cursor:pointer;}
  .tab-btn.active{border-color:var(--flag); color:var(--flag); background:var(--flag-ink);}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script src="../engine.js"></script>
<script>
(function(){
  "use strict";

  Engine.configure({
    appsScriptUrl: "https://script.google.com/macros/s/AKfycbwdGJAOLH5JskqJTckVxZuOGcu-nBAEj0DXe5M2tKcWHby4ZfVRM_1-IL11WA_g0iIr7Q/exec",
    gameType: "double-blind",
    // Host-only music, unlocked by the host's first button gesture.
    music: { idle:"free-jump.mp3", countdown:"free-jump.mp3", live:"neon-drive.mp3" }
  });

  function muteBtnHtml(){
    var m = Engine.audio.isMuted();
    return '<button class="mute-btn'+(m?" muted":"")+'" id="muteBtn" title="Toggle background music">' +
      (m ? "&#128263; Muted" : "&#128266; Sound") + '</button>';
  }

  var DEFAULT_MINUTES = 5;
  var SCORE_REFRESH_MS = 5000;
  var HOST_POLL_MS = 3000;   // the host writes state; it barely needs to read it
  var HOST_MISS_LIMIT = 4;   // consecutive null polls before we accept the game is gone
  var CLOCK_TICK_MS = 250;   // purely local — the clock never waits on a request

  // Tabulating screen: students finish a beat apart because each device
  // runs its own local clock, so give their saveRun writes a moment to
  // land before we freeze the podium.
  var TALLY_MIN_MS  = 2600;
  var TALLY_MAX_MS  = 9000;
  var TALLY_POLL_MS = 1200;

  var state = {
    hostCode: "", lastHostCode: "", hostChecked: false, hostCreating: false, hostCreateError: "",
    hostRejoining: false, hostRejoinError: "", hostMisses: 0,
    game: null, hostDurationMinutes: DEFAULT_MINUTES,
    playersShown: [], playersRound: null,
    screen: "dashboard",       // dashboard | results | history
    resultsRound: null, resultsRows: [], resultsLoading: false, tallySeen: 0,
    historyTab: "round",       // round | game | all
    historyRows: [], historyLoading: false
  };

  function lsGet(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  state.hostCode = lsGet("doubleblind_host_code");
  state.lastHostCode = lsGet("doubleblind_last_host_code");

  function masthead(kicker){
    return '<div class="masthead"><div class="kicker">'+esc(kicker||"AP STATISTICS · EXPERIMENTAL DESIGN")+'</div>' +
      '<img class="brand-logo" src="logo.png" alt="Double Blind" />' +
      '<div class="dateline"><span>Double Blind &mdash; Host</span><span>Front of Room</span></div></div>';
  }

  function render(){
    var html;
    if (!state.hostCode) html = viewCreate();
    else if (state.screen === "results") html = viewResults();
    else if (state.screen === "history") html = viewHistory();
    else html = viewDashboard();
    document.getElementById("app").innerHTML = html;
    bind();
  }

  function viewCreate(){
    return '' + masthead() +
      '<div class="card stack" style="text-align:center;">' +
        '<div><p class="eyebrow">Front of Room</p><h2 class="section-title">Start a new game</h2></div>' +
        '<p>Generate a game code to project on the board. Students open the class link and enter this code to join this room&rsquo;s round.</p>' +
        (state.hostCreateError ? '<div class="err" style="min-height:auto;">'+esc(state.hostCreateError)+'</div>' : '') +
        '<button class="btn btn-flag" id="hostCreateBtn" '+(state.hostCreating?"disabled":"")+'>'+(state.hostCreating?"Creating…":"Generate Game Code")+'</button>' +
        '<div style="margin-top:22px; border-top:1px solid var(--rule); padding-top:16px;">' +
          '<label for="hostRejoinCode">Already running a game? Enter its code</label>' +
          '<input id="hostRejoinCode" class="code-input" type="text" maxlength="6" placeholder="&mdash; &mdash; &mdash; &mdash;" autocomplete="off" autocapitalize="characters" />' +
          (state.hostRejoinError ? '<div class="err" style="min-height:auto;">'+esc(state.hostRejoinError)+'</div>' : '') +
          '<button class="btn btn-ghost btn-sm" id="hostRejoinBtn" style="margin-top:8px;" '+(state.hostRejoining?"disabled":"")+'>'+(state.hostRejoining?"Checking…":"Rejoin Game")+'</button>' +
        '</div>' +
      '</div>';
  }

  function phaseLabel(phase){
    return phase==="idle" ? "No round running" : phase==="countdown" ? "Starting…" : phase==="live" ? "Live" : "Round ended";
  }

  function clockText(game, phase){
    if (!game || phase==="idle") return "—";
    if (phase==="countdown") return Math.max(0, Math.ceil((game.countdownEndsAt-Date.now())/1000))+"s";
    if (phase==="live"){ var r=Math.max(0,Math.round((game.gameEndsAt-Date.now())/1000)); var mm=Math.floor(r/60), ss=r%60; return mm+":"+(ss<10?"0":"")+ss; }
    return "Done";
  }

  function rowsForRound(round){
    return state.playersRound === round ? state.playersShown : [];
  }

  function scoreTableHtml(round){
    return Engine.ui.scoreboardTableHtml(rowsForRound(round), [
      {key:"displayName", label:"Name"},
      {key:"period", label:"Period"},
      {key:"score", label:"Score", numeric:true},
      {key:"streak", label:"Streak", numeric:true},
      {key:"bestStreak", label:"Best", numeric:true}
    ]);
  }

  function waitingRosterHtml(){
    var rows = rowsForRound(Engine.WAITING_ROUND);
    if (!rows.length) return '<div class="lb-empty">No students connected yet.</div>';
    return '<div class="waiting-list">' + rows.map(function(row){
      var period = row.period ? 'Period '+esc(row.period) : '&mdash;';
      return '<div class="waiting-row"><span>'+esc(row.displayName || "Student")+'</span><span class="period">'+period+'</span></div>';
    }).join("") + '</div>';
  }

  function waitingCountText(){
    var n = rowsForRound(Engine.WAITING_ROUND).length;
    return n + ' student' + (n === 1 ? '' : 's') + ' connected';
  }

  function viewDashboard(){
    if (!state.hostChecked){
      return '' + masthead() + '<div class="card" style="text-align:center;"><p class="eyebrow">Loading&hellip;</p></div>';
    }
    var game = state.game;
    var phase = Engine.session.derivePhase(game);
    var mins = state.hostDurationMinutes;
    var running = (phase==="countdown" || phase==="live");
    var waitingPhase = (phase === "idle" || phase === "ended");
    var liveCount = rowsForRound(game ? game.round : null).length;
    return '<div class="dashboard-grid">' + masthead() +
      '<div class="card dashboard-code" style="text-align:center;">' +
        '<p class="eyebrow" style="margin:0;">Project this for the room</p>' +
        '<div class="game-code-display mono">'+esc(state.hostCode)+'</div>' +
        '<p class="host-note">Students go to the class link and enter this code to join.</p>' +
      '</div>' +
      '<div class="card dashboard-controls">' +
        '<div class="host-top"><div><p class="eyebrow" style="margin:0;">Front of Room</p><h2 class="section-title" style="margin:0;">Run the round</h2></div>' +
          '<div class="host-top-right">' + muteBtnHtml() +
            (Engine.audio.needsGesture && Engine.audio.needsGesture() ? '<button class="mute-btn" id="audioEnableBtn">Enable music</button>' : '') +
            '<span class="phase-pill '+phase+'" id="hostPhasePill">'+phaseLabel(phase)+'</span></div></div>' +
        (state.hostMisses ? '<p class="host-note" id="hostReconnectNote">Reconnecting to the game board&hellip;</p>' : '') +
        '<div class="big-clock mono" id="hostClockNum">'+clockText(game, phase)+'</div>' +
        '<div id="hostDurationBlock" style="display:'+(running?"none":"block")+';">' +
          '<label for="hostMinutes">Round length (minutes)</label>' +
          '<input id="hostMinutes" type="number" min="1" max="20" step="0.5" value="'+mins+'" />' +
          '<div class="preset-row">'+[3,5,8,10].map(function(m){ return '<button class="preset-chip'+(mins===m?' active':'')+'" data-min="'+m+'">'+m+' min</button>'; }).join("")+'</div>' +
        '</div>' +
        '<button class="btn btn-flag" id="hostStartBtn" style="margin-top:16px;" '+(running?"disabled":"")+'>'+(phase==="ended"?"Start Next Round":"Start Round")+'</button>' +
        '<button class="btn btn-ghost" id="hostEndBtn" style="margin-top:10px; display:'+(running?"block":"none")+';">End Round Now</button>' +
        (phase==="ended" ? '<button class="btn btn-ghost" id="showResultsBtn" style="margin-top:10px;">Show Round Results</button>' : '') +
        '<p class="host-note">Every device gets its own 5-second countdown the moment it hears the round start, then the full time you set. Anyone joining after that gets whatever time is left on this clock.</p>' +
        '<div class="host-utility-links">' +
          '<button class="link-quiet" id="historyBtn" style="display:block; margin:0 auto;"><i class="fa-solid fa-square-poll-vertical" aria-hidden="true"></i>View history (this round · this game · all games)</button>' +
          '<button class="link-quiet" id="newGameToggle" style="display:block; margin:8px auto 0;"><i class="fa-solid fa-square-binary" aria-hidden="true"></i>Start a different game (new code)</button>' +
          '<div class="reset-box" id="newGameBox" style="display:none; max-width:320px; margin:8px auto 0;">' +
            '<input type="text" id="newGameConfirm" placeholder="Type NEW to confirm" />' +
            '<button class="btn btn-ghost btn-sm" id="newGameGo" style="width:auto;">Go</button>' +
          '</div>' +
          // TODO resolved: the direct OpenGameArt listing URL was independently confirmed before release.
          '<div class="music-credit">Lobby/countdown music: &ldquo;Free Jump&rdquo; by <a href="https://opengameart.org/users/tad" target="_blank" rel="noopener">TAD</a>, from the <a href="https://opengameart.org/content/8-bit-pack-2" target="_blank" rel="noopener"><em>8-bit Pack 2</em></a> collection on OpenGameArt.org &mdash; licensed <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Live-round music: &ldquo;Neon Drive.&rdquo;<!-- TODO: add source/artist/license once confirmed --></div>' +
        '</div>' +
      '</div>' +
      '<div class="card dashboard-scoreboard">' +
        (waitingPhase
          ? '<p class="eyebrow" style="margin:0 0 4px;">Waiting Room</p><h2 class="section-title" style="margin:0 0 10px;">Students connected</h2><div id="hostScoreWrap">'+waitingRosterHtml()+'</div><div class="joined-note" id="hostJoinedNote">'+waitingCountText()+' &middot; roster refreshes every 5s</div>'
          : '<p class="eyebrow" style="margin:0 0 4px;">Live Scoreboard &mdash; this round</p><h2 class="section-title" style="margin:0 0 10px;">Round '+(game?game.round:0)+'</h2><div id="hostScoreWrap">'+scoreTableHtml(game ? game.round : null)+'</div><div class="joined-note" id="hostJoinedNote">'+liveCount+' reviewer'+(liveCount===1?'':'s')+' reporting this round &middot; board refreshes every 5s</div>') +
      '</div>' +
      '</div>';
  }

  /* ---------------------------------------------------------------
     RESULTS CUTSCENE — the tabulating screen is functional, not just
     decoration: it covers the couple of seconds in which the last
     students' saveRun writes land, so nobody gets left off the podium.
  ----------------------------------------------------------------*/
  var tallyTimer = null;

  function openResults(){
    state.screen = "results";
    state.resultsRound = state.game ? state.game.round : null;
    state.resultsRows = [];
    state.resultsLoading = true;
    state.tallySeen = 0;
    render();
    startTallyAnimation();

    if (!state.hostCode || state.resultsRound == null){
      stopTallyAnimation(); state.resultsLoading = false; render(); return;
    }

    var started = Date.now(), stableFor = 0, lastSig = "", best = [];

    function poll(){
      Engine.players.getPlayers(state.hostCode, state.resultsRound).then(function(rows){
        rows = rows || [];
        if (rows.length >= best.length) best = rows;   // never let a flaky read drop someone
        state.tallySeen = best.length;
        var sig = rows.length + ":" + rows.map(function(r){ return r.studentId + "-" + r.score; }).join(",");
        stableFor = (sig === lastSig) ? stableFor + TALLY_POLL_MS : 0;
        lastSig = sig;
        decide();
      }).catch(decide);
    }

    function decide(){
      var elapsed = Date.now() - started;
      var settled = (stableFor >= TALLY_POLL_MS * 2) && best.length > 0;
      if (elapsed >= TALLY_MAX_MS || (settled && elapsed >= TALLY_MIN_MS)){
        stopTallyAnimation();
        state.resultsRows = best;
        state.resultsLoading = false;
        render();
      } else {
        setTimeout(poll, TALLY_POLL_MS);
      }
    }

    poll();
  }

  function startTallyAnimation(){
    stopTallyAnimation();
    var phrases = ["Closing the archive", "Collecting filings", "Checking the numbers", "Setting the front page"];
    var shown = 0, ticks = 0;
    tallyTimer = setInterval(function(){
      var target = state.tallySeen || 0;
      if (shown < target) shown += Math.max(1, Math.ceil((target - shown) / 4));
      var n = document.getElementById("tallyNum");
      if (n) n.textContent = shown;
      if (++ticks % 14 === 0){
        var l = document.getElementById("tallyLabel");
        if (l) l.textContent = phrases[(ticks / 14) % phrases.length];
      }
    }, 90);
  }

  function stopTallyAnimation(){
    if (tallyTimer){ clearInterval(tallyTimer); tallyTimer = null; }
  }

  function viewResults(){
    var body;
    if (state.resultsLoading){
      body = '<div class="tally">' +
        '<div class="tally-num mono" id="tallyNum">0</div>' +
        '<div class="tally-cap">Filings in</div>' +
        '<div class="tally-label" id="tallyLabel">Closing the archive</div>' +
        '<div class="tally-wire"><span></span></div>' +
      '</div>';
    } else {
      var rows = state.resultsRows;
      var top3 = rows.slice(0, 3);
      var rest = rows.slice(3);
      var order = [1, 0, 2]; // display order: 2nd, 1st, 3rd — classic podium layout
      var podium = top3.length ? '<div class="podium">' + order.map(function(i){
        var r = top3[i];
        if (!r) return "";
        var rank = i + 1;
        return '<div class="podium-slot rank-'+rank+'"><div class="p-name">'+esc(r.displayName)+'</div><div class="p-score">'+r.score+'</div>' +
          '<div class="podium-bar">'+rank+'</div></div>';
      }).join("") + '</div>' : '';
      var restHtml = rest.length ? '<div class="results-rest">' + rest.map(function(r,i){
        return '<div class="results-row"><span class="r-rank">'+(i+4)+'</span><span>'+esc(r.displayName)+'</span><span class="r-score">'+r.score+'</span></div>';
      }).join("") + '</div>' : '';
      body = !rows.length ? '<div class="results-empty">No scores reported for this round.</div>' : podium + restHtml;
    }
    return '' +
      '<button class="backlink" id="resultsBackBtn">&larr; Back to dashboard</button>' +
      '<div class="results-stage">' +
        '<div class="results-kicker">Round '+(state.resultsRound||0)+' &middot; Final Verdict</div>' +
        '<div class="results-title">'+(state.resultsLoading ? "Tallying Reviews" : "The Results Are In")+'</div>' +
        body +
      '</div>' +
      (state.resultsLoading ? '' :
        '<div style="text-align:center; margin-top:16px;"><button class="btn btn-flag" id="resultsNextBtn">Start Next Round</button></div>');
  }

  /* ---------------------------------------------------------------
     HISTORY
  ----------------------------------------------------------------*/
  function openHistory(tab){
    state.screen = "history";
    state.historyTab = tab || state.historyTab;
    loadHistory();
  }

  function loadHistory(){
    state.historyLoading = true; state.historyRows = []; render();
    var opts = {};
    if (state.historyTab === "round"){
      if (!state.game){ state.historyLoading = false; render(); return; }
      opts = { code: state.hostCode, round: state.game.round };
    } else if (state.historyTab === "game"){
      opts = { code: state.hostCode };
    }
    Engine.leaderboard.get(opts).then(function(rows){
      state.historyRows = rows || []; state.historyLoading = false; render();
    }).catch(function(){ state.historyLoading = false; render(); });
  }

  function viewHistory(){
    var tabs = [
      {key:"round", label:"This Round"},
      {key:"game", label:"This Game"},
      {key:"all", label:"All Games"}
    ];
    var tabBtns = tabs.map(function(t){
      return '<button class="tab-btn'+(state.historyTab===t.key?' active':'')+'" data-tab="'+t.key+'">'+t.label+'</button>';
    }).join("");
    var body;
    if (state.historyLoading) body = '<div class="lb-empty">Loading&hellip;</div>';
    else if (!state.historyRows.length) body = '<div class="lb-empty">No results in this view yet.</div>';
    else body = '<div style="overflow-x:auto;"><table class="lb"><thead><tr><th>#</th><th>Name</th><th>Period</th><th>Code</th><th class="num">Round</th><th class="num">Score</th><th class="num">Best</th><th class="num">Correct</th><th class="num">Acc.</th></tr></thead><tbody>' +
      state.historyRows.map(function(r,i){
        var badgeCls = "rank-badge"+(i<3?" top":"");
        var correctTotal = (r.correct!=null && r.attempted!=null) ? r.correct+"/"+r.attempted : "&mdash;";
        return '<tr><td><span class="'+badgeCls+'">'+(i+1)+'</span></td><td>'+esc(r.displayName)+'</td>' +
          '<td class="mono" style="color:var(--ink-soft); font-size:12px;">'+esc(r.period||"&mdash;")+'</td>' +
          '<td class="mono" style="color:var(--ink-soft); font-size:12px;">'+esc(r.code||"&mdash;")+'</td>' +
          '<td class="num">'+r.round+'</td><td class="num">'+r.score+'</td>' +
          '<td class="num">'+(r.bestStreak==null?'&mdash;':r.bestStreak)+'</td>' +
          '<td class="num">'+correctTotal+'</td>' +
          '<td class="num">'+(r.accuracy!=null?r.accuracy+'%':'&mdash;')+'</td></tr>';
      }).join("") + '</tbody></table></div>';
    return '' +
      '<button class="backlink" id="historyBackBtn">&larr; Back to dashboard</button>' +
      masthead() +
      '<div class="card">' +
        '<p class="eyebrow" style="margin:0 0 10px;">Results History</p>' +
        '<div class="history-tabs">'+tabBtns+'</div>' +
        body +
      '</div>';
  }

  function hostCreateGame(){
    if (state.hostCreating) return;
    if (!Engine.audio.isMuted()) Engine.audio.playFor("idle");
    state.hostCreating = true; state.hostCreateError = ""; render();
    // Teardown clears the active code but keeps lastHostCode, so a new
    // code still retires the abandoned room and releases its students.
    var retireCode = state.hostCode || state.lastHostCode || undefined;
    Engine.session.createGame(retireCode).then(function(code){
      state.hostCreating = false; state.hostCode = code; state.lastHostCode = code; state.hostChecked = false;
      state.hostMisses = 0; state.playersShown = []; state.playersRound = null;
      state.hostDurationMinutes = DEFAULT_MINUTES;
      lsSet("doubleblind_host_code", code);
      lsSet("doubleblind_last_host_code", code);
      startPolling(code);
      render();
    }).catch(function(){
      Engine.audio.stop();
      state.hostCreating = false;
      state.hostCreateError = "Couldn't create the game. Check your connection and try again.";
      render();
    });
  }

  function hostStartRound(){
    if (!state.hostCode) return;
    var minsInput = document.getElementById("hostMinutes");
    var mins = minsInput ? parseFloat(minsInput.value) : state.hostDurationMinutes;
    if (!mins || mins < 1) mins = DEFAULT_MINUTES;
    if (mins > 20) mins = 20;
    state.hostDurationMinutes = mins;
    stopTallyAnimation();
    // startRound() updates Engine's state synchronously and returns it,
    // so the host's own screen reacts on the click with no round trip.
    var game = Engine.session.startRound(state.hostCode, mins);
    state.game = game; lastRound = game.round; lastLocalPhase = null;
    state.playersShown = []; state.playersRound = null;
    state.screen = "dashboard";
    render();
  }

  function hostRejoinGame(){
    var input = document.getElementById("hostRejoinCode");
    var code = input ? input.value.replace(/[^A-Z0-9]/g, "").toUpperCase() : "";
    if (state.hostRejoining) return;
    state.hostRejoining = true; state.hostRejoinError = ""; render();
    Engine.session.checkCode(code).then(function(found){
      state.hostRejoining = false;
      if (!found){
        state.hostRejoinError = "No active game with that code.";
        render();
        return;
      }
      state.hostCode = code; state.lastHostCode = code; state.hostChecked = false; state.hostMisses = 0;
      state.game = null; state.playersShown = []; state.playersRound = null; state.screen = "dashboard"; lastRound = null;
      lsSet("doubleblind_host_code", code);
      lsSet("doubleblind_last_host_code", code);
      startPolling(code);
      render();
    }).catch(function(){
      state.hostRejoining = false;
      state.hostRejoinError = "Couldn't reach the game board — try again.";
      render();
    });
  }

  function hostEndRound(){
    if (!state.hostCode) return;
    var game = Engine.session.endRound(state.hostCode);
    state.game = game; lastLocalPhase = null;
    render();
  }

  var scoreTimer = null;
  function ensureScoreLoop(){
    if (scoreTimer) return;
    scoreTimer = setInterval(function(){
      if (!state.hostCode || !state.game) return;
      if (state.screen !== "dashboard") return;   // results screen runs its own poll
      var phase = Engine.session.derivePhase(state.game);
      var waitingPhase = (phase === "idle" || phase === "ended");
      var round = waitingPhase ? Engine.WAITING_ROUND : state.game.round;
      Engine.players.getPlayers(state.hostCode, round).then(function(rows){
        state.playersShown = rows || [];
        state.playersRound = round;
        var wrap = document.getElementById("hostScoreWrap");
        if (wrap) wrap.innerHTML = waitingPhase ? waitingRosterHtml() : scoreTableHtml(round);
        var note = document.getElementById("hostJoinedNote");
        if (note) note.textContent = waitingPhase
          ? waitingCountText()+' · roster refreshes every 5s'
          : state.playersShown.length+' reviewer'+(state.playersShown.length===1?'':'s')+' reporting this round · board refreshes every 5s';
      }).catch(function(){});
    }, SCORE_REFRESH_MS);
  }

  function updateClockUI(){
    var game = state.game;
    var phase = Engine.session.derivePhase(game);
    var pill = document.getElementById("hostPhasePill");
    var clock = document.getElementById("hostClockNum");
    if (pill){ pill.className = "phase-pill "+phase; pill.textContent = phaseLabel(phase); }
    if (clock) clock.textContent = clockText(game, phase);
    var startBtn = document.getElementById("hostStartBtn");
    var endBtn = document.getElementById("hostEndBtn");
    var durationBlock = document.getElementById("hostDurationBlock");
    var running = (phase==="countdown"||phase==="live");
    if (startBtn) startBtn.disabled = running;
    if (endBtn) endBtn.style.display = running ? "block" : "none";
    if (durationBlock) durationBlock.style.display = running ? "none" : "block";
  }

  /* ---------------------------------------------------------------
     LOCAL CLOCK — derivePhase() and clockText() are pure functions of
     Date.now() against timestamps we already hold, so the dashboard
     clock has no business waiting on a poll. This ticks it locally at
     4fps; polling is now only for state we DIDN'T originate.
  ----------------------------------------------------------------*/
  var lastLocalPhase = null;
  setInterval(function(){
    if (state.screen !== "dashboard" || !state.hostChecked || !state.game) return;
    var phase = Engine.session.derivePhase(state.game);
    Engine.audio.playFor(phase);   // no-op unless the phase actually changed
    if (phase !== lastLocalPhase){
      lastLocalPhase = phase;
      render();   // phase pill, buttons and "Show Round Results" all flip together
      return;
    }
    updateClockUI();
  }, CLOCK_TICK_MS);

  var lastRound = null;
  function startPolling(code){
    Engine.session.startPolling(code, HOST_POLL_MS, function(game, meta){
      state.hostChecked = true;
      if (!game){
        if (!meta || !meta.retired){
          state.hostMisses += 1;
          if (state.hostMisses < HOST_MISS_LIMIT){
            if (state.screen === "dashboard") render();
            return;
          }
        }
        state.hostMisses = 0;
        state.hostCode = ""; lsSet("doubleblind_host_code","");
        Engine.audio.stop();
        render();
        return;
      }
      var wasReconnecting = state.hostMisses > 0;
      state.hostMisses = 0;
      state.game = game;
      var roundChanged = game.round !== lastRound;
      lastRound = game.round;
      if (roundChanged){
        state.playersShown = []; state.playersRound = null;
        lastLocalPhase = null;
        render();
      } else if (wasReconnecting || !document.getElementById("hostPhasePill") && state.screen === "dashboard"){
        render();   // first paint after boot
      }
      ensureScoreLoop();
    });
  }

  function bind(){
    var el;
    if ((el = document.getElementById("muteBtn"))) el.addEventListener("click", function(){
      Engine.audio.setMuted(!Engine.audio.isMuted());
      this.className = "mute-btn" + (Engine.audio.isMuted() ? " muted" : "");
      this.innerHTML = Engine.audio.isMuted() ? "&#128263; Muted" : "&#128266; Sound";
    });
    if ((el = document.getElementById("audioEnableBtn"))) el.addEventListener("click", function(){
      Engine.audio.unlock();
      render();
    });
    if ((el = document.getElementById("hostCreateBtn"))) el.addEventListener("click", hostCreateGame);
    if ((el = document.getElementById("hostRejoinCode"))) el.addEventListener("input", function(){ this.value = this.value.replace(/[^A-Z0-9]/gi, "").toUpperCase().slice(0,6); });
    if ((el = document.getElementById("hostRejoinBtn"))) el.addEventListener("click", hostRejoinGame);
    if ((el = document.getElementById("hostRejoinCode"))) el.addEventListener("keydown", function(e){ if (e.key === "Enter") hostRejoinGame(); });
    if ((el = document.getElementById("hostStartBtn"))) el.addEventListener("click", hostStartRound);
    if ((el = document.getElementById("hostEndBtn"))) el.addEventListener("click", hostEndRound);
    if ((el = document.getElementById("showResultsBtn"))) el.addEventListener("click", openResults);
    if ((el = document.getElementById("resultsBackBtn"))) el.addEventListener("click", function(){ stopTallyAnimation(); state.screen = "dashboard"; lastLocalPhase = null; render(); });
    if ((el = document.getElementById("resultsNextBtn"))) el.addEventListener("click", hostStartRound);
    if ((el = document.getElementById("historyBtn"))) el.addEventListener("click", function(){ openHistory(); });
    if ((el = document.getElementById("historyBackBtn"))) el.addEventListener("click", function(){ state.screen = "dashboard"; lastLocalPhase = null; render(); });
    Array.prototype.forEach.call(document.querySelectorAll(".tab-btn"), function(tabBtn){
      tabBtn.addEventListener("click", function(){ openHistory(tabBtn.getAttribute("data-tab")); });
    });
    if ((el = document.getElementById("hostMinutes"))) el.addEventListener("change", function(){ var v=parseFloat(this.value); if (v) state.hostDurationMinutes = v; });
    if ((el = document.getElementById("newGameToggle"))) el.addEventListener("click", function(){ var box=document.getElementById("newGameBox"); box.style.display = box.style.display==="none"?"flex":"none"; });
    if ((el = document.getElementById("newGameGo"))) el.addEventListener("click", function(){ var val=document.getElementById("newGameConfirm").value.trim().toUpperCase(); if (val==="NEW") hostCreateGame(); });
    Array.prototype.forEach.call(document.querySelectorAll(".preset-chip"), function(chip){
      chip.addEventListener("click", function(){
        var m = parseFloat(chip.getAttribute("data-min"));
        state.hostDurationMinutes = m;
        var input = document.getElementById("hostMinutes"); if (input) input.value = m;
        render();
      });
    });
  }

  if (window.addEventListener) {
    window.addEventListener("engineaudiochange", function(){
      if (state.screen === "dashboard") render();
    });
  }

  if (state.hostCode) startPolling(state.hostCode);
  render();
})();
</script>
</body>
