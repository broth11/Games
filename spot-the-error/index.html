<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spot the Error — Derivatives</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0B0F17; --card:#121826; --card-2:#1A2233; --ink:#E8EEF7; --ink-soft:#7C8AA3;
    --rule:#26314A; --flag:#FF3B6B; --flag-ink:#2A0E17; --wire:#3EF2C0; --wire-ink:#0A2620;
    --power:#5FA8FF; --chain:#F5C445; --product:#D68CFF; --trig:#8FA8FF; --units:#FF9E6D; --focus:#5FA8FF;
    --shadow: 0 0 0 1px rgba(95,168,255,0.08), 0 8px 30px -8px rgba(95,168,255,0.25);
    --glow-wire: 0 0 14px rgba(62,242,192,0.55);
    --glow-flag: 0 0 14px rgba(255,59,107,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1px 1px at 12% 18%, rgba(232,238,247,0.4) 100%, transparent),
      radial-gradient(1px 1px at 78% 42%, rgba(232,238,247,0.3) 100%, transparent),
      radial-gradient(1px 1px at 34% 68%, rgba(232,238,247,0.35) 100%, transparent),
      radial-gradient(1px 1px at 61% 85%, rgba(232,238,247,0.25) 100%, transparent),
      radial-gradient(1px 1px at 90% 12%, rgba(232,238,247,0.3) 100%, transparent),
      radial-gradient(ellipse 700px 500px at 85% -5%, rgba(95,168,255,0.10), transparent 70%),
      var(--paper);
    color:var(--ink); font-family:"IBM Plex Sans",-apple-system,system-ui,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  .mono{font-family:"IBM Plex Mono","SF Mono",monospace; font-variant-numeric:tabular-nums;}
  .display{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;}
  a{color:inherit;} button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--focus); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
  .wrap{max-width:640px; margin:0 auto; padding:28px 18px 60px;}
  .wrap:has(.register-shell){max-width:1040px;}
  .register-shell{display:block;}
  .register-cols{display:flex; flex-direction:column; gap:16px;}
  @media (min-width:760px){
    .register-cols{display:grid; grid-template-columns:1fr 1fr; align-items:stretch; gap:20px;}
    .register-cols .card{margin-top:0;}
  }
  .register-leaderboard{margin-top:20px;}
  .masthead{text-align:center; margin-bottom:22px;}
  .masthead{position:relative;}
  .masthead::before{
    content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:220px; height:18px;
    background:
      linear-gradient(var(--rule) 1px, transparent 1px) 0 0/100% 6px,
      linear-gradient(var(--rule) 1px, transparent 1px) 0 6px/100% 6px,
      linear-gradient(var(--rule) 1px, transparent 1px) 0 12px/100% 6px;
    opacity:.35; z-index:0;
  }
  .kicker{font-family:"IBM Plex Mono",monospace; font-size:0.6875rem; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px;}
  .nameplate{font-family:"Cormorant",serif; font-weight:600; font-size:clamp(2.5rem,10vw,4rem); line-height:0.9; letter-spacing:0.01em; text-transform:uppercase; text-wrap:balance; margin:0;}
  .nameplate em{font-style:normal; color:var(--flag);}
  .nameplate::after{
    content:"_"; color:var(--wire); animation:cursorBlink 1.1s steps(1) infinite;
    text-shadow:var(--glow-wire);
  }
  @keyframes cursorBlink{ 50%{ opacity:0; } }
  .dateline{display:flex; justify-content:space-between; align-items:center; border-top:2px solid var(--ink); border-bottom:1px solid var(--rule); padding:6px 2px; margin-top:10px; font-family:"IBM Plex Mono",monospace; font-size:0.6875rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);}
  .card{background:var(--card); border:1px solid var(--rule); border-radius:3px; box-shadow:var(--shadow); padding:20px 20px 22px;}
  .stack > * + *{margin-top:16px;}
  .eyebrow{font-family:"IBM Plex Mono",monospace; font-size:0.6875rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 10px;}
  h2.section-title{font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:1.5rem; letter-spacing:.01em; text-transform:uppercase; margin:0 0 4px; text-wrap:balance;}
  p{line-height:1.5;}
  .legend{display:grid; gap:10px;}
  .legend-row{display:grid; grid-template-columns:14px 1fr; gap:10px; align-items:start;}
  .swatch{width:14px; height:14px; border-radius:3px; margin-top:3px; flex:none;}
  .legend-row b{font-weight:600;} .legend-row span{color:var(--ink-soft); font-size:0.875rem;}
  label{display:block; font-size:0.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:6px;}
  input[type=text], input[type=number], select{width:100%; padding:12px 12px; border-radius:3px; border:1.5px solid var(--rule); background:var(--card-2); color:var(--ink); font-size:1rem; font-family:inherit;}
  input[type=text]:focus, input[type=number]:focus, select:focus{border-color:var(--focus);}
  .field + .field{margin-top:14px;}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px 18px; border-radius:3px; border:none; cursor:pointer; font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:1.1875rem; letter-spacing:.03em; text-transform:uppercase; background:var(--ink); color:var(--paper); transition:transform .08s ease;}
  .btn:active{transform:scale(0.98);} .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-flag{background:var(--flag); color:var(--flag-ink);}
  .btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--rule);}
  .btn-row{display:flex; gap:10px; margin-top:14px;} .btn-row .btn{width:auto; flex:1;}
  .err{color:var(--flag); font-size:0.8125rem; margin-top:8px; min-height:16px;}
  .ticker{border-top:1px dashed var(--rule); margin-top:26px; padding-top:14px;}
  .ticker-title{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .ticker-title .eyebrow{margin:0;}
  .ticker-row{display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--rule); font-size:0.875rem;}
  .ticker-row:last-child{border-bottom:none;}
  .ticker-rank{font-family:"IBM Plex Mono",monospace; color:var(--ink-soft); font-size:0.75rem;}
  .ticker-name{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ticker-score{font-family:"IBM Plex Mono",monospace; font-weight:600;}
  .empty-note{color:var(--ink-soft); font-size:0.8125rem; font-style:italic;}
  .link-quiet{display:inline-flex; align-items:center; gap:6px; background:var(--card-2); border:1.5px solid var(--rule); color:var(--ink); font-family:"IBM Plex Mono",monospace; font-size:0.84375rem; font-weight:500; text-decoration:none; cursor:pointer; padding:11px 18px; border-radius:20px; transition:border-color .12s, background .12s;}
  .link-quiet:hover, .link-quiet:focus-visible{border-color:var(--flag); color:var(--flag);}
  .link-quiet:active{transform:scale(0.98);}
  .pulse-dot{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--flag); margin-right:8px; animation:pulseDot 1.4s ease-in-out infinite;}
  @keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .lobby-status{display:flex; align-items:center; font-family:"IBM Plex Mono",monospace; font-size:0.8125rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}

  /* ---- COUNTDOWN MASK — fully local, so this can actually animate ---- */
  .mask{position:fixed; inset:0; z-index:80; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:#12100E; color:#F6F1E4; animation:maskIn .25s ease-out;}
  @keyframes maskIn{ from{opacity:0;} to{opacity:1;} }
  .mask-kicker{font-family:"IBM Plex Mono",monospace; font-size:0.8125rem; letter-spacing:.2em; text-transform:uppercase; opacity:.7;}
  .mask-num{font-family:"Big Shoulders Display",sans-serif; font-weight:900; font-size:clamp(6.875rem,34vw,15rem); line-height:1; color:var(--wire); text-shadow:0 0 40px rgba(62,242,192,0.45); position:relative; display:inline-flex; align-items:center; justify-content:center;}
  .mask-num.pop{animation:countPop .55s cubic-bezier(.2,.8,.3,1);}
  @keyframes countPop{
    0%   { transform:scale(1.7); opacity:0; }
    45%  { transform:scale(1);   opacity:1; }
    100% { transform:scale(1);   opacity:1; }
  }
  .mask-sub{font-family:"IBM Plex Mono",monospace; font-size:0.8125rem; opacity:.55; max-width:320px; text-align:center;}

  .hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:14px;}
  .hud-block{font-family:"IBM Plex Mono",monospace; font-size:0.75rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}
  .hud-num{font-size:1.25rem; font-weight:600; color:var(--ink); display:block;}
  .timerbar{height:8px; background:var(--card-2); border:1px solid var(--rule); border-radius:5px; overflow:hidden; margin-bottom:20px;}
  .timerfill{height:100%; background:var(--flag); width:100%; transition:width 1s linear, background .3s;}
  .late-note{font-family:"IBM Plex Mono",monospace; font-size:0.71875rem; color:var(--chain); text-align:center; margin:-12px 0 14px;}
  .work-card{position:relative; background:
      repeating-linear-gradient(0deg, rgba(95,168,255,0.03) 0px, rgba(95,168,255,0.03) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, rgba(95,168,255,0.03) 0px, rgba(95,168,255,0.03) 1px, transparent 1px, transparent 28px),
      var(--card);
    border:1px solid var(--rule); border-radius:10px; box-shadow:var(--shadow); overflow:hidden;}
  .work-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--power), transparent);
    opacity:.6; animation:scanSweep 3.5s linear infinite;
  }
  @keyframes scanSweep{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(100%); } }
  .work-head{display:flex; align-items:center; gap:10px; padding:14px 16px 10px;}
  .avatar{width:38px; height:38px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-family:"Big Shoulders Display",sans-serif; font-weight:800; font-size:1rem; color:var(--flag-ink); background:var(--flag);}
  .work-who{min-width:0;}
  .work-title{font-weight:700; font-size:0.90625rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .work-meta{font-family:"IBM Plex Mono",monospace; font-size:0.71875rem; color:var(--ink-soft);}
  .work-tag{margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:0.625rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--rule); border-radius:20px; padding:3px 9px; flex:none;}
  .work-body{padding:2px 16px 18px; font-size:1.125rem; line-height:1.45; text-wrap:balance;}
  .work-foot{display:flex; gap:20px; padding:10px 16px; border-top:1px solid var(--rule); font-family:"IBM Plex Mono",monospace; font-size:0.75rem; color:var(--ink-soft);}
  .step-choice{display:block; width:100%; margin:4px 0; padding:8px 10px; text-align:left; border:1px solid var(--rule); border-radius:4px; background:var(--card-2); color:var(--ink); cursor:pointer; font-family:"IBM Plex Mono",monospace;}
  .step-choice:disabled{opacity:.55; cursor:not-allowed;}
  .step-choice.correct-glow,
  #cleanChoice.correct-glow,
  .verdict-btn.correct-glow{
    border-color:var(--wire);
    box-shadow:0 0 0 3px rgba(23,130,114,0.25), 0 0 16px rgba(23,130,114,0.5);
    animation:verdictGlowPulse 0.9s ease-in-out infinite alternate;
  }
  .step-choice.correct-glow:disabled,
  #cleanChoice.correct-glow:disabled,
  .verdict-btn.correct-glow:disabled{opacity:1;}
  @keyframes verdictGlowPulse{
    from{box-shadow:0 0 0 2px rgba(23,130,114,0.18), 0 0 8px rgba(23,130,114,0.3);}
    to{box-shadow:0 0 0 4px rgba(23,130,114,0.38), 0 0 22px rgba(23,130,114,0.6);}
  }
  .answer-icon{float:right; font-family:system-ui,sans-serif; font-weight:800; font-size:1.125rem; line-height:1;}
  .answer-icon.correct{color:#178272;} .answer-icon.wrong{color:#D8433E;}
  .stamp-overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(20,23,20,0.28); opacity:0; pointer-events:none; transition:opacity .15s ease;}
  .stamp-overlay.show{opacity:1; pointer-events:auto;}
  .stamp-overlay.show.correct{background:rgba(20,23,20,0.06);}
  .stamp{font-family:"Big Shoulders Display",sans-serif; font-weight:900; font-size:clamp(1.375rem,6vw,2.125rem); text-transform:uppercase; letter-spacing:.02em; padding:10px 22px; border-radius:6px; border:2px solid currentColor; text-align:center;}
  .stamp.correct{color:var(--wire); background:var(--wire-ink); box-shadow:var(--glow-wire);}
  .stamp.wrong{color:var(--flag); background:var(--flag-ink); box-shadow:var(--glow-flag);}
  .explain{background:var(--card); border:1px solid var(--rule); border-top:none; border-radius:0 0 10px 10px; margin-top:-1px; padding:14px 16px 16px; font-size:0.90625rem; color:var(--ink-soft); display:none;}
  .explain.show{display:block;} .explain b{color:var(--ink);}
  .katex{font-size:1.1em;}
  .verdicts{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px;}
  .verdict-btn{padding:18px 14px; border-radius:8px; border:2px solid var(--rule); background:var(--card-2); color:var(--ink); cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:5px; transition:border-color .12s, transform .08s, box-shadow .12s; min-height:64px;}
  .verdict-btn:active{transform:scale(0.98);}
  .verdict-btn:hover, .verdict-btn:focus-visible{border-color:var(--power); box-shadow:0 0 16px rgba(95,168,255,0.25);}
  .verdict-btn .vlabel{font-weight:700; font-size:1.03125rem;} .verdict-btn .vsub{font-size:0.78125rem; color:var(--ink-soft);}
  .verdict-btn .vbar{width:26px; height:5px; border-radius:3px; margin-bottom:3px;}
  .verdict-btn[data-cat="power"] .vbar{background:var(--power);}
  .verdict-btn[data-cat="chain"] .vbar{background:var(--chain);}
  .verdict-btn[data-cat="productQuotient"] .vbar{background:var(--product);}
  .verdict-btn[data-cat="trigExpLog"] .vbar{background:var(--trig);}
  .verdict-btn[data-cat="algebraSimplification"] .vbar{background:var(--focus);}
  .verdict-btn[data-cat="unitsInterpretation"] .vbar{background:var(--units);}
  .verdict-btn[data-cat="clean"] .vbar{background:var(--wire);}
  .verdict-btn:disabled{opacity:.5; cursor:default;} .verdict-btn.clean-btn{grid-column:1 / -1;}

  /* ---- PLAY SCREEN STRUCTURE ---- */
  body:has(.play-shell){overflow:hidden;}
  .wrap:has(.play-shell){width:94%; max-width:1760px; height:100vh; padding:14px 18px; overflow:hidden;}
  .play-shell{height:100%; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(340px,.95fr); grid-template-rows:minmax(0,11fr) minmax(0,74fr) minmax(0,15fr); column-gap:18px; row-gap:10px;}
  .play-header{grid-column:2; grid-row:1; min-height:0; overflow:auto;}
  .play-header .timerbar{margin-bottom:0;}
  .play-header .late-note{margin:6px 0 0;}
  .play-layout{display:contents;}
  .play-pane{min-width:0; min-height:0;}
  .play-pane-work{grid-column:1; grid-row:1 / 4;}
  .play-pane-classify{grid-column:2; grid-row:2;}
  .play-pane-work .work-card,.play-pane-classify .classify-card{height:100%;}
  .play-pane-work .work-card{display:flex; flex-direction:column;}
  .play-pane-work .work-head{padding:12px 16px 6px;}
  .play-pane-classify .card{margin-top:0;}
  .classify-card{overflow:auto;}
  .classify-placeholder{height:100%; display:flex; align-items:center; justify-content:center; text-align:center; color:var(--ink-soft); font-size:0.875rem; padding:18px;}
  .classify-card .explain.miss-fill{height:100%; margin:0; border:1px solid var(--flag); border-radius:10px; padding:20px 22px; font-size:1rem; line-height:1.45; color:var(--ink); overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; justify-content:center;}
  .classify-card .explain.miss-fill--category{justify-content:flex-start;}
  .classify-card .miss-fill-text{width:100%;}
  .classify-card .miss-cat{display:flex; flex-direction:column; gap:4px; margin-bottom:14px;}
  .classify-card .miss-cat .vbar{width:26px; height:5px; border-radius:3px;}
  .classify-card .miss-cat .vlabel{font-weight:700; font-size:1.03125rem; color:var(--ink);}
  .play-pane-work .work-body{padding-bottom:10px;}
  .work-body{display:flex; flex:1 1 auto; flex-direction:column; min-height:0; overflow:hidden;}
  .work-body > p{margin:8px 0;}
  .step-list{min-width:0; min-height:40px; flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; padding-right:2px;}
  .play-explanation{grid-column:2; grid-row:3; min-height:0; overflow:hidden;}
  .play-explanation .explain{display:block; height:100%; margin:0; border:1px solid var(--rule); border-radius:10px; overflow-y:auto; overscroll-behavior:contain;}
  .play-explanation .explain-empty{display:flex; align-items:center; justify-content:center; text-align:center; color:var(--ink-soft); font-style:italic;}
  .task-line{margin:0 0 6px; font-weight:700;}
  .given-line{display:grid; grid-template-columns:auto minmax(0,1fr); align-items:start; gap:8px; margin:0 0 6px; padding:6px 8px; background:var(--card-2); border:1px solid var(--rule); border-radius:6px;}
  .given-label{font-weight:700; white-space:nowrap;}
  .task-line .math-step,.given-line .math-step{min-width:0;}
  .work-card--dense .work-body{font-size:1rem; line-height:1.32;}
  .work-card--dense .step-choice{margin:3px 0; padding:6px 8px;}
  .work-card--dense .answer-icon{font-size:1rem;}
  .work-card--dense .math-step{overflow-x:auto;}
  @media (max-width:899px){
    .play-shell{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,10fr) minmax(0,70fr) minmax(0,20fr); gap:10px;}
    .play-header{grid-column:1; grid-row:1;}
    .play-layout{display:block; grid-column:1; grid-row:2; overflow-y:auto; overscroll-behavior:contain;}
    .play-pane-work .work-card,.play-pane-classify .classify-card{height:auto;}
    .play-pane-work .work-body{display:block; overflow:visible;}
    .play-pane-classify{margin-top:10px;}
    .step-list{min-height:0; max-height:31vh; overflow-y:auto;}
    .play-pane-classify .classify-card{padding:14px; max-height:none;}
    .play-pane-classify .verdicts{gap:8px; margin-top:10px;}
    .play-pane-classify .verdict-btn{min-height:0; padding:9px 10px; gap:2px;}
    .play-pane-classify .verdict-btn .vlabel{font-size:0.875rem;}
    .play-pane-classify .verdict-btn .vsub{display:none;}
    .play-explanation{grid-column:1; grid-row:3;}
  }

  .score-hero{text-align:center; padding:8px 0 4px;}
  .score-num{font-family:"Big Shoulders Display",sans-serif; font-weight:900; font-size:5.5rem; line-height:.9; color:var(--flag);}
  .score-cap{font-family:"IBM Plex Mono",monospace; font-size:0.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft);}
  .stat-row{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:18px;}
  .stat-tile{background:var(--card-2); border:1px solid var(--rule); border-radius:6px; padding:12px 10px; text-align:center;}
  .stat-tile .n{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:1.375rem; display:block;}
  .stat-tile .l{font-size:0.65625rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);}
  .corrections{border:1px dashed var(--rule); border-radius:6px; padding:14px; margin-top:18px;}
  .corrections .eyebrow{margin-bottom:8px;}
  .corr-row{display:flex; justify-content:space-between; font-size:0.875rem; padding:5px 0; border-bottom:1px solid var(--rule);}
  .corr-row:last-child{border:none;}
  .short-run{background:var(--card-2); border:1px solid var(--rule); border-left:3px solid var(--chain); border-radius:4px; padding:10px 12px; margin-top:16px; font-size:0.8125rem; color:var(--ink-soft);}
  .lb-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  table.lb{width:100%; border-collapse:collapse; margin-top:14px; font-size:0.875rem;}
  table.lb th{text-align:left; font-family:"IBM Plex Mono",monospace; font-size:0.65625rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); padding:0 6px 8px; border-bottom:1px solid var(--power);}
  table.lb td{padding:9px 6px; border-bottom:1px solid var(--rule); vertical-align:middle;}
  table.lb td.num, table.lb th.num{font-family:"IBM Plex Mono",monospace; text-align:right; font-variant-numeric:tabular-nums;}
  .rank-badge{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; font-family:"IBM Plex Mono",monospace; font-size:0.6875rem; font-weight:600; background:var(--card-2); color:var(--ink-soft);}
  .rank-badge.top{background:var(--wire); color:var(--wire-ink); text-shadow:0 0 6px rgba(62,242,192,0.6);}
  .lb-empty{padding:30px 10px; text-align:center; color:var(--ink-soft); font-size:0.875rem;}
  .backlink{display:inline-flex; align-items:center; gap:6px; margin-bottom:14px; background:var(--card-2); border:1.5px solid var(--rule); border-radius:20px; font-family:"IBM Plex Mono",monospace; font-size:0.8125rem; font-weight:500; color:var(--ink); text-decoration:none; cursor:pointer; padding:9px 16px;}
  .backlink:hover, .backlink:focus-visible{border-color:var(--flag); color:var(--flag);}
  .foot-note{text-align:center; margin-top:26px; font-size:0.6875rem; color:var(--ink-soft);}
  .code-input{text-transform:uppercase; text-align:center; letter-spacing:.3em; font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:1.375rem !important;}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="../engine.js"></script>
<script src="questions.js"></script>
<script>
(function(){
  "use strict";

  // ---- one-time config for this game ----
  Engine.configure({
    appsScriptUrl: "https://script.google.com/macros/s/AKfycbwdGJAOLH5JskqJTckVxZuOGcu-nBAEj0DXe5M2tKcWHby4ZfVRM_1-IL11WA_g0iIr7Q/exec",
    gameType: "spot-the-error-derivatives"
  });

  var POLL_MS = 1500;          // lobby / play poll cadence (engine adds jitter)
  var PROGRESS_FLUSH_MS = 5000; // coalesce live-score writes to protect the backend
  var LOBBY_HEARTBEAT_MS = 10000;

  /* ---------------------------------------------------------------
     GROUP 2 PLACEHOLDER CONTENT
     The verified 54-item derivative bank is inserted in its dedicated
     authoring step; this keeps Group 2 focused on platform wiring.
  ----------------------------------------------------------------*/

  var CATS = {
    power:       {label:"Power Rule Slip",              sub:"Exponent or coefficient error", color:"var(--power)"},
    chain:       {label:"Chain Rule Slip",              sub:"Inner derivative omitted",     color:"var(--chain)"},
    productQuotient: {label:"Product/Quotient Rule Slip", sub:"Rule structure error",        color:"var(--product)"},
    trigExpLog:  {label:"Trig/Exp/Log Rule Slip",       sub:"Derivative rule error",        color:"var(--trig)"},
    algebraSimplification: {label:"Algebra/Simplification Slip", sub:"Correct rule, wrong algebra", color:"var(--focus)"},
    unitsInterpretation: {label:"Units/Interpretation Slip", sub:"Correct math, wrong meaning", color:"var(--units)"},
    clean:       {label:"Clean — No Error",             sub:"Every step is correct",        color:"var(--wire)"}
  };
  var CAT_ORDER = ["power","chain","productQuotient","trigExpLog","algebraSimplification","unitsInterpretation","clean"];
  var STAGE_TWO_CATEGORIES = ["power","chain","productQuotient","trigExpLog","algebraSimplification","unitsInterpretation"];
  var TIER_POINTS = {foundational:10, structured:15, abstract:20};

  /* ---------------------------------------------------------------
     STATE
  ----------------------------------------------------------------*/
  var state = {
    screen: "register",   // register | briefing | lobby | countdown | play | results | leaderboard
    gameCode: "",
    joinError: "",

    game: null,
    joinedRound: -1,

    // LOCAL clock for this device — set once when we join a round and
    // never touched by the network again (except a host force-end).
    localCountdownEnd: 0,
    localPlayEnd: 0,
    announcedEndsAt: 0,
    joinedLate: false,
    joinedSeconds: 0,

    deck: [], idx: 0, score: 0, streak: 0, bestStreak: 0, correct: 0, attempted: 0, misses: {},
    secondsLeft: 0, timerId: null, answering: false, answerTimer: null, countdownHandle: null,
    stage: "locate", feedback: null, feedbackKind: null, icons: {steps:{}, clean:"", categories:{}},

    lbCache: [], lbLoaded: false
  };

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function shuffle(arr){ var a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function buildDeck(){
    var foundational = shuffle(BANK.filter(function(item){ return item.tier === "foundational"; }));
    var structured = shuffle(BANK.filter(function(item){ return item.tier === "structured"; }));
    var abstract = shuffle(BANK.filter(function(item){ return item.tier === "abstract"; }));
    return foundational.concat(structured, abstract);
  }
  function mmss(sec){ var m=Math.floor(sec/60), s=sec%60; return m+":"+(s<10?"0":"")+s; }

  function lsGet(k){ try{ return localStorage.getItem(k)||""; }catch(e){ return ""; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function lsClear(k){ try{ localStorage.removeItem(k); }catch(e){} }

  // A game code is never deleted from the Games sheet, so an old cached
  // code always still "exists" — a poll against it won't come back null,
  // it'll just sit at phase "ended" forever if the teacher has since moved
  // on to a different code (new period, next day, whatever). Auto-resuming
  // into the lobby on that stale code leaves a returning student watching
  // a round that will never start. CODE_TTL_MS bounds how long we'll trust
  // a cached code without the student re-confirming it — long enough to
  // survive a single class period, short enough to force a fresh join the
  // next day.
  var CODE_TTL_MS = 4 * 60 * 60 * 1000; // 4 hours
  function rememberCode(code){
    lsSet("spoterror_code", code);
    lsSet("spoterror_code_ts", String(Date.now()));
  }
  function forgetCode(){
    state.gameCode = ""; lsClear("spoterror_code"); lsClear("spoterror_code_ts");
  }
  function cachedCodeIsFresh(){
    var ts = parseInt(lsGet("spoterror_code_ts"), 10);
    return !!ts && (Date.now() - ts) < CODE_TTL_MS;
  }

  state.gameCode = lsGet("spoterror_code");

  /* ---------------------------------------------------------------
     RENDER ROUTER
  ----------------------------------------------------------------*/
  function render(){
    var app = document.getElementById("app");
    if (state.screen === "register") app.innerHTML = viewRegister();
    else if (state.screen === "briefing") app.innerHTML = viewBriefing();
    else if (state.screen === "lobby") app.innerHTML = viewLobby();
    else if (state.screen === "countdown") app.innerHTML = Engine.ui.maskHtml(state.localCountdownEnd, "Round starts in", "Get ready to inspect worked derivatives.");
    else if (state.screen === "play") app.innerHTML = viewPlay();
    else if (state.screen === "results") app.innerHTML = viewResults();
    else if (state.screen === "leaderboard") app.innerHTML = viewLeaderboard();
    renderKatexSteps();
    bind();
    syncLobbyPresence();
  }

  // Play content is replaced on every item transition, so this must run
  // after every render rather than only once at page load. Each authored
  // row gets its own aligned environment to preserve its tappable wrapper.
  function renderKatexSteps(){
    if (!window.katex) return;
    Array.prototype.forEach.call(document.querySelectorAll(".math-step"), function(node){
      var latex = node.textContent;
      window.katex.render("\\begin{aligned}" + latex + "\\end{aligned}", node, {
        displayMode: true,
        throwOnError: false
      });
    });
    // Explanations are injected only after a response resolves. The auto-render
    // extension is loaded above, but it does nothing until explicitly called on
    // this newly created DOM subtree.
    if (!window.renderMathInElement) return;
    Array.prototype.forEach.call(document.querySelectorAll(".explain"), function(node){
      window.renderMathInElement(node, {
        delimiters: [
          {left:"$$", right:"$$", display:true},
          {left:"$", right:"$", display:false},
          {left:"\\(", right:"\\)", display:false},
          {left:"\\[", right:"\\]", display:true}
        ],
        throwOnError: false
      });
    });
  }

  function masthead(kicker){
    return '<div class="masthead"><div class="kicker">' + esc(kicker || "IB MATHEMATICS AI HL · CALCULUS") + '</div>' +
      '<h1 class="nameplate">Spot <em>the</em> Error</h1>' +
      '<div class="dateline"><span>Derivative Marking Desk</span><span>Two-Stage Practice</span></div></div>';
  }

  /* ---------------------------------------------------------------
     REGISTER
  ----------------------------------------------------------------*/
  function viewRegister(){
    var legendRows = CAT_ORDER.map(function(k){
      var c = CATS[k];
      return '<div class="legend-row"><div class="swatch" style="background:'+c.color+'"></div><div><b>'+esc(c.label)+'.</b> <span>'+esc(c.sub)+'</span></div></div>';
    }).join("");
    return '' +
      masthead() +
      '<div class="register-shell">' +
        '<div class="register-cols">' +
          '<div class="card stack">' +
            '<div><p class="eyebrow">Your Assignment</p><h2 class="section-title">Inspect the working</h2>' +
            '<p>Each item shows a worked derivative. Locate the first incorrect step, or choose Clean when every step is correct. Then classify the kind of slip.</p></div>' +
            '<div class="legend">' + legendRows + '</div>' +
          '</div>' +
          '<div class="card stack">' +
            '<div><p class="eyebrow">Student sign-in</p><h2 class="section-title">Join the round</h2></div>' +
            '<div class="field"><label for="codeInput">Game code (from your teacher\'s screen)</label>' +
              '<input id="codeInput" class="code-input" type="text" maxlength="6" placeholder="&mdash; &mdash; &mdash; &mdash;" value="'+esc(state.gameCode)+'" autocomplete="off" autocapitalize="characters" />' +
              '<p style="font-size:0.71875rem; color:var(--ink-soft); margin:6px 2px 0;">Letters and numbers only &mdash; codes never use 0, 1, I, L, or O.</p></div>' +
            '<div class="field"><label for="idInput">Your student ID</label>' +
              '<input id="idInput" type="text" inputmode="numeric" maxlength="10" placeholder="e.g. 19136" value="'+esc(Engine.identity.studentId)+'" /></div>' +
            '<div class="err" id="regErr">' + esc(state.joinError) + '</div>' +
            '<button class="btn btn-flag" id="startBtn">Join the Marking Desk</button>' +
          '</div>' +
        '</div>' +
        '<div class="register-leaderboard">' +
          leaderboardPreview() +
          '<div style="text-align:center;"><button class="link-quiet" id="toLbBtn">View full leaderboard &rarr;</button></div>' +
          '<p class="foot-note">Completed rounds are recorded on the shared class leaderboard.</p>' +
        '</div>' +
      '</div>';
  }

  function leaderboardPreview(){
    var rows = state.lbCache.slice(0,5);
    var body = rows.length ? rows.map(function(r,i){
      return '<div class="ticker-row"><span class="ticker-rank">'+(i+1)+'</span><span class="ticker-name">'+esc(r.displayName)+'</span><span class="ticker-score mono">'+r.score+'</span></div>';
    }).join("") : '<p class="empty-note">No completed rounds yet.</p>';
    return '<div class="ticker"><div class="ticker-title"><p class="eyebrow" style="margin:0;">Top Scores</p></div><div class="ticker-list">'+body+'</div></div>';
  }

  /* ---------------------------------------------------------------
     BRIEFING
  ----------------------------------------------------------------*/
  function viewBriefing(){
    return '' + masthead("Assignment Briefing") +
      '<div class="card stack">' +
        '<div><p class="eyebrow">'+esc(Engine.identity.displayName)+' &middot; Period '+esc(Engine.identity.period)+'</p><h2 class="section-title">How scoring works</h2></div>' +
        '<p>First, tap the step that contains the error, or choose <b>Clean — No Error</b>. If you locate a real error, classify it in a second step.</p>' +
        '<p><b>Foundational</b> items are worth 10 points, <b>Structured</b> items 15, and <b>Abstract</b> items 20. Correctly locating the error (or identifying Clean) earns the tier points and advances your streak immediately. Correctly classifying an error adds a 5-point bonus.</p>' +
        '<p>Only a Stage 1 miss resets the streak. From streak 3 onward, each correct Stage 1 call earns an extra 5 points per streak step. Wait in the lobby until the host starts the round.</p>' +
        '<button class="btn btn-flag" id="goBtn">Enter the Lobby</button>' +
      '</div>' +
      '<div style="text-align:center; margin-top:10px;"><button class="link-quiet" id="switchCodeBtn">Wrong class or code? Switch game</button></div>';
  }

  /* ---------------------------------------------------------------
     LOBBY
  ----------------------------------------------------------------*/
  function viewLobby(){
    var phase = Engine.session.derivePhase(state.game);
    var msg = "Waiting for the host to start the round&hellip;";
    if (phase === "ended") msg = "The last round ended. Waiting for the next one to start&hellip;";
    return '' + masthead("Marking Desk Lobby") +
      '<div class="card stack" style="text-align:center;">' +
        '<div><p class="eyebrow">'+esc(Engine.identity.displayName)+' &middot; Period '+esc(Engine.identity.period)+'</p><h2 class="section-title">You&rsquo;re checked in</h2></div>' +
        '<div class="lobby-status" style="justify-content:center;"><span class="pulse-dot"></span>'+msg+'</div>' +
        '<p style="color:var(--ink-soft); font-size:0.84375rem;">Keep this tab open &mdash; the round starts for everyone at once.</p>' +
      '</div>' +
      '<div style="text-align:center; margin-top:16px;">' +
        '<button class="link-quiet" id="toLbBtn">View full leaderboard &rarr;</button>' +
        '<button class="link-quiet" id="switchCodeBtn" style="display:block; margin:6px auto 0;">Nothing happening? Switch game code</button>' +
      '</div>';
  }

  /* ---------------------------------------------------------------
     JOINING A ROUND — all local from here on
  ----------------------------------------------------------------*/
  function enterRound(game){
    if (!game || game.round === state.joinedRound) return;
    // Already played at least one round this session (a restart, or the
    // normal next-round handoff) → always show the countdown, don't risk
    // the "late joiner" path just because a poll happened to land late.
    // Only a genuinely fresh join (first round ever for this device,
    // state.joinedRound still -1) can land in the middle of a round
    // that's already been running a while, where skipping the countdown
    // is the right call.
    var alreadyPlaying = state.joinedRound !== -1;
    var plan = Engine.round.plan(game, alreadyPlaying);
    if (!plan) return;

    state.joinedRound     = plan.round;
    state.announcedEndsAt = game.gameEndsAt;
    state.localCountdownEnd = plan.countdownEnd;
    state.localPlayEnd      = plan.playEnd;
    state.joinedLate        = plan.late;
    state.joinedSeconds     = plan.secondsAvailable;

    if (plan.countdownEnd){
      state.screen = "countdown";
      render();
      if (state.countdownHandle) state.countdownHandle.cancel();
      state.countdownHandle = Engine.round.runCountdown(
        plan.countdownEnd,
        function(n){ Engine.ui.setMaskNum(n); },
        function(){ state.countdownHandle = null; beginLocalRound(); }
      );
    } else {
      beginLocalRound(); // late joiner — straight in, no fake countdown
    }
  }

  function currentCard(){ return state.deck[state.idx]; }

  function beginLocalRound(){
    state.deck = buildDeck(); state.idx = 0; state.score = 0; state.streak = 0; state.bestStreak = 0;
    state.correct = 0; state.attempted = 0; state.misses = {}; state.answering = false;
    state.stage = "locate"; state.feedback = null; state.feedbackKind = null; state.icons = {steps:{}, clean:"", categories:{}};
    state.screen = "play";
    pushPlayerProgress(true);
    render();
    clearInterval(state.timerId);
    state.timerId = setInterval(playTick, 1000);
    playTick();
  }

  // Reads state.localPlayEnd, never the network.
  function playTick(){
    var remaining = Math.max(0, Math.round((state.localPlayEnd - Date.now())/1000));
    state.secondsLeft = remaining;
    var total = state.joinedSeconds || 1;
    var fill = document.getElementById("timerFill");
    if (fill){
      var pct = Math.max(0, Math.min(100, Math.round((remaining/total)*100)));
      fill.style.width = pct+"%"; fill.style.background = pct>33 ? "var(--flag)" : "var(--chain)";
    }
    var secEl = document.getElementById("secLeft");
    if (secEl) secEl.textContent = mmss(remaining);
    if (remaining <= 0){ clearInterval(state.timerId); finishRun(); render(); }
  }

  function viewPlay(){
    if (state.idx >= state.deck.length) state.deck = state.deck.concat(buildDeck());
    var card = currentCard();
    var total = state.joinedSeconds || 1;
    var pct = Math.max(0, Math.min(100, Math.round((state.secondsLeft/total)*100)));
    var barColor = pct>33 ? "var(--flag)" : "var(--chain)";
    function iconHtml(status){
      return status ? '<span class="answer-icon '+status+'">'+(status === "correct" ? "✓" : "✗")+'</span>' : '';
    }
    var steps = card.steps.map(function(step, i){
      var stepCls = "step-choice"+(state.icons.steps[i] === "correct" ? " correct-glow" : "");
      return '<button class="'+stepCls+'" data-step-index="'+i+'" '+(state.answering || state.stage !== "locate"?"disabled":"")+'><span class="step-label"><b>Step '+(i+1)+'.</b></span><span class="math-step">'+esc(step)+'</span>'+iconHtml(state.icons.steps[i])+'</button>';
    }).join("");
    var task = '<div class="task-line"><span class="math-step">'+esc(card.instruction)+'</span></div>';
    var given = '<div class="given-line"><span class="given-label">Given:</span><span class="math-step">'+esc(card.given)+'</span></div>';
    var btns = STAGE_TWO_CATEGORIES.map(function(k){
      var c = CATS[k];
      var cls = "verdict-btn"+(state.icons.categories[k] === "correct" ? " correct-glow" : "");
      return '<button class="'+cls+'" data-cat="'+k+'" '+(state.answering?"disabled":"")+'>' +
        '<span class="vbar"></span><span class="vlabel">'+esc(c.label)+'</span><span class="vsub">'+esc(c.sub)+'</span>'+iconHtml(state.icons.categories[k])+'</button>';
    }).join("");
    var lateNote = state.joinedLate
      ? '<div class="late-note">Joined mid-round &mdash; you have '+mmss(state.joinedSeconds)+' left on the room clock.</div>'
      : '';
    var feedbackBody = state.feedback
      ? '<b>'+esc(state.feedback.title)+'.</b> '+esc(state.feedback.detail)+'<br>'+card.explanation
      : '';
    var isMiss = state.feedbackKind === "stage1Miss" || state.feedbackKind === "stage2Miss";
    var classify;
    if (state.feedbackKind === "stage1Miss"){
      classify = '<div class="explain show miss-fill"><div class="miss-fill-text">'+feedbackBody+'</div></div>';
    } else if (state.feedbackKind === "stage2Miss"){
      var cc = CATS[card.errorCategory];
      classify = '<div class="explain show miss-fill miss-fill--category">' +
        '<div class="miss-cat"><span class="vbar" style="background:'+cc.color+';"></span><span class="vlabel">'+esc(cc.label)+'</span></div>' +
        '<div class="miss-fill-text">'+feedbackBody+'</div></div>';
    } else if (state.stage === "classify"){
      classify = '<p class="eyebrow">Stage 2</p><h2 class="section-title">Classify the slip</h2><div class="verdicts" id="verdictGrid">'+btns+'</div>';
    } else {
      classify = '<div class="classify-placeholder">Stage 2 will appear here after you locate an error.</div>';
    }
    var explanation = (state.feedback && !isMiss)
      ? '<div class="explain show"><b>'+esc(state.feedback.title)+'.</b> '+esc(state.feedback.detail)+'<br>'+card.explanation+'</div>'
      : '<div class="explain explain-empty">Feedback will appear here after you respond.</div>';
    return '' +
      '<div class="play-shell">' +
      '<div class="play-header"><div class="hud">' +
          '<div class="hud-block">Score<span class="hud-num mono" id="scoreNum">'+state.score+'</span></div>' +
          '<div class="hud-block">Streak<span class="hud-num mono" id="streakNum">'+state.streak+'</span></div>' +
          '<div class="hud-block">Time Left<span class="hud-num mono" id="secLeft">'+mmss(state.secondsLeft)+'</span></div>' +
        '</div>' +
        '<div class="timerbar"><div class="timerfill" id="timerFill" style="width:'+pct+'%; background:'+barColor+';"></div></div>' +
        lateNote +
      '</div>' +
      '<div class="play-layout">' +
      '<div class="play-pane play-pane-work"><div class="work-card'+(card.steps.length > 5 ? ' work-card--dense' : '')+'">' +
        '<div class="work-head"><div class="work-who"><div class="work-title">Worked derivative</div><div class="work-meta">'+esc(card.tier)+' tier</div></div></div>' +
        '<div class="work-body">'+task+given+'<p><b>Stage 1: Locate the error.</b> Tap the first incorrect step, or choose Clean.</p><div id="stepList" class="step-list">'+steps+'</div>' +
          '<button class="btn btn-ghost'+(state.icons.clean === "correct" ? " correct-glow" : "")+'" id="cleanChoice" '+(state.answering || state.stage !== "locate"?"disabled":"")+'>Clean — No Error'+iconHtml(state.icons.clean)+'</button></div>' +
      '</div></div>' +
      '<div class="play-pane play-pane-classify"><div class="card classify-card">'+classify+'</div></div>' +
      '</div>' +
      '<div class="play-explanation">'+explanation+'</div>' +
      '</div>';
  }

  function recordMiss(card){
    var missKey = card.errorCategory || "clean";
    state.misses[missKey] = (state.misses[missKey]||0)+1;
  }

  function awardStageOneCorrect(card){
    var points = TIER_POINTS[card.tier];
    state.attempted += 1; state.correct += 1; state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    var bonus = state.streak >= 3 ? (state.streak-2)*5 : 0;
    if (state.streak >= 3) points += (state.streak-2)*5;
    state.score += points;
    pushPlayerProgress();
    return {base: TIER_POINTS[card.tier], bonus: bonus};
  }

  function resolveStageOneMiss(card, title, detail){
    state.attempted += 1; state.streak = 0; recordMiss(card);
    pushPlayerProgress();
    state.feedbackKind = "stage1Miss";
    finishItem(title, detail, 7000);
  }

  function finishItem(title, detail, delay){
    state.answering = true;
    state.feedback = {title:title, detail:detail};
    render();
    state.answerTimer = setTimeout(function(){
      state.answerTimer = null;
      if (state.screen !== "play") return;   // a force-end landed while reading
      state.idx += 1; state.answering = false; state.stage = "locate"; state.feedback = null; state.feedbackKind = null;
      state.icons = {steps:{}, clean:"", categories:{}};
      if (state.secondsLeft <= 0){ clearInterval(state.timerId); finishRun(); }
      render();
    }, delay);
  }

  function handleLocate(choice){
    if (state.answering || state.stage !== "locate") return;
    var card = currentCard(); if (!card) return;
    state.answering = true;
    var pickedClean = choice === "clean";
    if (card.errorStepIndex === null && pickedClean){
      state.icons.clean = "correct";
      awardStageOneCorrect(card);
      state.feedbackKind = "correct";
      finishItem("Correct", "This item is clean — no step contains an error.", 1500);
    } else if (card.errorStepIndex === null && !pickedClean){
      state.icons.steps[choice] = "wrong";
      resolveStageOneMiss(card, "Incorrect", "This item is clean — no step contains an error.");
    } else if (card.errorStepIndex !== null && pickedClean){
      state.icons.clean = "wrong"; state.icons.steps[card.errorStepIndex] = "correct";
      resolveStageOneMiss(card, "Incorrect", "The error is actually at Step "+(card.errorStepIndex + 1)+".");
    } else if (choice === card.errorStepIndex){
      state.icons.steps[choice] = "correct";
      awardStageOneCorrect(card);
      state.answering = false; state.stage = "classify"; render();
    } else {
      state.icons.steps[choice] = "wrong"; state.icons.steps[card.errorStepIndex] = "correct";
      resolveStageOneMiss(card, "Incorrect", "The error is actually at Step "+(card.errorStepIndex + 1)+".");
    }
  }

  function handleCategory(category){
    if (state.answering || state.stage !== "classify") return;
    var card = currentCard(); if (!card) return;
    var correct = category === card.errorCategory;
    state.icons.categories[category] = correct ? "correct" : "wrong";
    if (!correct) state.icons.categories[card.errorCategory] = "correct";
    if (correct) state.score += 5;
    else recordMiss(card);
    pushPlayerProgress();
    state.feedbackKind = correct ? "correct" : "stage2Miss";
    finishItem(correct ? "Correct category — +5 bonus" : "Category missed — no +5 bonus",
      correct ? "You earned the 5-point category bonus." : "This was actually a "+CATS[card.errorCategory].label+". Your Stage 1 tier points and streak are unchanged.",
      correct ? 1500 : 7000);
  }

  function finishRun(){
    if (state.screen === "results") return;   // already filed — don't double-save
    state.screen = "results";
    clearTimeout(state.answerTimer); state.answerTimer = null;
    clearInterval(state.timerId);
    pushPlayerProgress(true);
    var accuracy = state.attempted ? Math.round((state.correct/state.attempted)*100) : 0;
    Engine.players.saveRun({
      code: state.gameCode, round: state.joinedRound,
      studentId: Engine.identity.studentId, displayName: Engine.identity.displayName, period: Engine.identity.period,
      score: state.score, correct: state.correct, attempted: state.attempted, accuracy: accuracy, bestStreak: state.bestStreak
    });
  }

  /* ---------------------------------------------------------------
     PROGRESS WRITES — coalesced. A full class answering every few
     seconds was previously firing a write per answer, each one taking
     a script lock. Batching to one write per 5s keeps the host's 5s
     scoreboard just as fresh for a fraction of the backend load.
  ----------------------------------------------------------------*/
  var progTimer = null, progDirty = false;
  var lobbyPresenceTimer = null;

  function pushPlayerProgress(force){
    if (!state.gameCode || state.joinedRound < 0) return;
    progDirty = true;
    if (force){ clearTimeout(progTimer); progTimer = null; flushProgress(); return; }
    if (progTimer) return;
    progTimer = setTimeout(function(){ progTimer = null; flushProgress(); }, PROGRESS_FLUSH_MS);
  }

  function flushProgress(){
    if (!progDirty) return;
    progDirty = false;
    Engine.players.pushProgress({
      code: state.gameCode, round: state.joinedRound,
      studentId: Engine.identity.studentId, displayName: Engine.identity.displayName, period: Engine.identity.period,
      score: state.score, streak: state.streak, bestStreak: state.bestStreak,
      correct: state.correct, attempted: state.attempted
    });
  }

  function shouldSendLobbyPresence(){
    if (state.screen !== "lobby" || !state.gameCode || !Engine.identity.isLoggedIn()) return false;
    var phase = Engine.session.derivePhase(state.game);
    return phase === "idle" || phase === "ended";
  }

  function sendLobbyPresence(){
    if (!shouldSendLobbyPresence()) return;
    Engine.players.pushWaitingPresence({
      code: state.gameCode,
      studentId: Engine.identity.studentId,
      displayName: Engine.identity.displayName,
      period: Engine.identity.period
    });
  }

  function stopLobbyPresence(){
    if (lobbyPresenceTimer) {
      clearInterval(lobbyPresenceTimer);
      lobbyPresenceTimer = null;
    }
  }

  function syncLobbyPresence(){
    if (!shouldSendLobbyPresence()) {
      stopLobbyPresence();
      return;
    }
    if (lobbyPresenceTimer) return;
    sendLobbyPresence();
    lobbyPresenceTimer = setInterval(sendLobbyPresence, LOBBY_HEARTBEAT_MS);
  }

  /* ---------------------------------------------------------------
     RESULTS
  ----------------------------------------------------------------*/
  function viewResults(){
    var accuracy = state.attempted ? Math.round((state.correct/state.attempted)*100) : 0;
    var missEntries = Object.keys(state.misses).sort(function(a,b){ return state.misses[b]-state.misses[a]; });
    var corrRows = missEntries.length ? missEntries.map(function(k){
      return '<div class="corr-row"><span>'+esc(CATS[k].label)+'</span><span class="mono">&times;'+state.misses[k]+'</span></div>';
    }).join("") : '<div class="corr-row"><span>No misses recorded.</span><span></span></div>';
    var shortNote = state.joinedLate
      ? '<div class="short-run">You joined with '+mmss(state.joinedSeconds)+' left on the room clock, so this was a shorter round.</div>'
      : '';
    return '' + masthead("Final Edition") +
      '<div class="card">' +
        '<div class="score-hero"><div class="score-cap">'+esc(Engine.identity.displayName)+' &middot; Period '+esc(Engine.identity.period)+'</div>' +
          '<div class="score-num mono">'+state.score+'</div><div class="score-cap">Points Filed</div></div>' +
        '<div class="stat-row">' +
          '<div class="stat-tile"><span class="n">'+accuracy+'%</span><span class="l">Accuracy</span></div>' +
          '<div class="stat-tile"><span class="n">'+state.correct+'/'+state.attempted+'</span><span class="l">Calls Made</span></div>' +
          '<div class="stat-tile"><span class="n">'+state.bestStreak+'</span><span class="l">Best Streak</span></div>' +
        '</div>' +
        shortNote +
        '<div class="corrections"><p class="eyebrow">Corrections &mdash; missed most often</p>'+corrRows+'</div>' +
        '<div class="btn-row">' +
          '<button class="btn btn-ghost" id="againBtn">Back to the Lobby</button>' +
          '<button class="btn btn-flag" id="lbBtn">View Leaderboard</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------------------------------------------------------
     LEADERBOARD
  ----------------------------------------------------------------*/
  function refreshLeaderboard(){
    Engine.leaderboard.get(100).then(function(rows){
      state.lbCache = rows || []; state.lbLoaded = true;
      if (state.screen === "leaderboard" || state.screen === "register") render();
    }).catch(function(){ state.lbLoaded = true; });
  }

  function viewLeaderboard(){
    var body;
    if (!state.lbLoaded) body = '<div class="lb-empty">Loading leaderboard&hellip;</div>';
    else if (!state.lbCache.length) body = '<div class="lb-empty">No completed rounds yet.</div>';
    else body = '<div style="overflow-x:auto;"><table class="lb"><thead><tr><th>#</th><th>Name</th><th>Period</th><th class="num">Score</th><th class="num">Acc.</th></tr></thead><tbody>' +
      state.lbCache.map(function(r,i){
        var badgeCls = "rank-badge"+(i<3?" top":"");
        return '<tr><td><span class="'+badgeCls+'">'+(i+1)+'</span></td><td>'+esc(r.displayName)+'</td>' +
          '<td class="mono" style="color:var(--ink-soft); font-size:0.75rem;">'+esc(r.period||"&mdash;")+'</td>' +
          '<td class="num">'+r.score+'</td><td class="num">'+(r.accuracy!=null?r.accuracy+'%':'&mdash;')+'</td></tr>';
      }).join("") + '</tbody></table></div>';
    return '' + '<button class="backlink" id="backBtn">&larr; Back</button>' + masthead("Leaderboard") +
      '<div class="card"><div class="lb-head"><div><p class="eyebrow" style="margin:0;">All-Time Scores</p><h2 class="section-title" style="margin:0;">Leaderboard</h2></div></div>' +
      body + '</div>';
  }

  /* ---------------------------------------------------------------
     EVENT BINDING
  ----------------------------------------------------------------*/
  function bind(){
    var el;
    if ((el = document.getElementById("codeInput"))){
      el.addEventListener("input", function(){
        var pos = this.selectionStart; this.value = this.value.toUpperCase();
        try { this.setSelectionRange(pos,pos); } catch(e){}
      });
    }
    if ((el = document.getElementById("startBtn"))){
      el.addEventListener("click", function(){
        var btn = this;
        var code = document.getElementById("codeInput").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
        var id = document.getElementById("idInput").value.trim();
        var errEl = document.getElementById("regErr");
        if (!code){ errEl.textContent = "Enter the game code your teacher projected."; return; }
        if (!id){ errEl.textContent = "Enter your student ID."; return; }
        errEl.textContent = "Checking…"; btn.disabled = true;
        Promise.all([Engine.session.checkCode(code), Engine.identity.lookup(id)]).then(function(res){
          btn.disabled = false;
          var codeOk = res[0]; var idRes = res[1];
          if (!codeOk){ errEl.textContent = "We couldn't find that game code. Double-check with your teacher."; return; }
          if (!idRes || !idRes.found){ errEl.textContent = "That student ID isn't on the roster. Double-check the number."; return; }
          errEl.textContent = "";
          state.gameCode = code; state.joinError = "";
          rememberCode(code);
          startGamePolling(code);
          state.screen = "briefing";
          render();
        }).catch(function(){
          btn.disabled = false;
          errEl.textContent = "Couldn't reach the game board — try again.";
        });
      });
      document.getElementById("idInput").addEventListener("keydown", function(e){ if (e.key==="Enter") document.getElementById("startBtn").click(); });
    }
    if ((el = document.getElementById("toLbBtn"))) el.addEventListener("click", function(){ state.screen="leaderboard"; render(); });
    if ((el = document.getElementById("switchCodeBtn"))) el.addEventListener("click", function(){
      Engine.session.stopPolling();
      stopLobbyPresence();
      forgetCode();
      state.joinError = "";
      state.screen = "register"; render();
    });
    if ((el = document.getElementById("goBtn"))) el.addEventListener("click", function(){ state.screen="lobby"; render(); });
    if ((el = document.getElementById("stepList"))) el.addEventListener("click", function(e){ var btn=e.target.closest(".step-choice"); if(btn) handleLocate(parseInt(btn.getAttribute("data-step-index"), 10)); });
    if ((el = document.getElementById("cleanChoice"))) el.addEventListener("click", function(){ handleLocate("clean"); });
    if ((el = document.getElementById("verdictGrid"))) el.addEventListener("click", function(e){ var btn=e.target.closest(".verdict-btn"); if(btn) handleCategory(btn.getAttribute("data-cat")); });
    if ((el = document.getElementById("againBtn"))) el.addEventListener("click", function(){ state.screen="lobby"; render(); });
    if ((el = document.getElementById("lbBtn"))) el.addEventListener("click", function(){ state.screen="leaderboard"; render(); });
    if ((el = document.getElementById("backBtn"))) el.addEventListener("click", function(){ state.screen = state.gameCode ? "lobby" : "register"; render(); });
  }

  /* ---------------------------------------------------------------
     GAME POLLING — the network's ONLY remaining jobs are: tell us a
     new round has started, and tell us the host force-ended one.
     Everything between those two moments runs off the local clock.
  ----------------------------------------------------------------*/
  function startGamePolling(code){
    Engine.session.startPolling(code, POLL_MS, function(game, meta){
      state.game = game;
      meta = meta || {};

      if (!game && (state.screen==="lobby" || state.screen==="briefing")){
        forgetCode();
        state.joinError = meta.retired
          ? "Your teacher started a new game — enter the new code."
          : "That game code isn't active anymore — ask your teacher for the current code.";
        state.screen = "register"; render();
        return;
      }
      if (!game || state.screen === "register") return;

      // A genuinely NEW round exists (different round number than the
      // one we last joined). Jump into it immediately from wherever we
      // are — including mid-play — cancelling whatever local timer,
      // pending answer reveal, or countdown was in flight. This is what
      // makes a teacher's "End Round Now" followed by "Start Round" (a
      // deliberate restart, not just letting the old one run out) reach
      // students who were still actively playing: a new round can land
      // with a LATER gameEndsAt than the one they're mid-way through, so
      // the shrink check below would never catch it — only the round
      // number reliably tells us it's a different round at all.
      if (game.round !== state.joinedRound){
        var incomingPhase = Engine.session.derivePhase(game);
        if (incomingPhase === "countdown" || incomingPhase === "live"){
          stopLobbyPresence();
          clearInterval(state.timerId);
          clearTimeout(state.answerTimer); state.answerTimer = null;
          if (state.countdownHandle){ state.countdownHandle.cancel(); state.countdownHandle = null; }
          enterRound(game);
          return;
        }
      }

      // Same round we're already in, but the host force-ended it early
      // without (yet) starting a new one: gameEndsAt jumps backward from
      // what we were told at join time. Honor it right away rather than
      // waiting for the local timer to run out on its own. The 1s slack
      // ignores ordinary poll noise.
      if ((state.screen === "play" || state.screen === "countdown") &&
          state.announcedEndsAt && game.gameEndsAt < state.announcedEndsAt - 1000){
        state.localPlayEnd = Math.min(state.localPlayEnd, game.gameEndsAt);
        if (state.countdownHandle){ state.countdownHandle.cancel(); state.countdownHandle = null; }
        if (Date.now() >= state.localPlayEnd){ finishRun(); render(); return; }
      }

      if (state.screen === "lobby") render();
    });
  }

  /* ---------------------------------------------------------------
     BOOT
  ----------------------------------------------------------------*/
  if (Engine.identity.isLoggedIn() && state.gameCode && cachedCodeIsFresh()){
    state.screen = "lobby";
    startGamePolling(state.gameCode);
  } else if (state.gameCode && !cachedCodeIsFresh()){
    // Old enough that the teacher has likely moved on to a different code
    // (next period, next day). Don't silently sit in a dead lobby — land
    // back on register instead. Leave state.gameCode as-is so the code
    // field shows the old value prefilled (one tap to re-join if it's
    // still the same code), but clear the stored timestamp so we don't
    // keep re-triggering this on every reload.
    lsClear("spoterror_code_ts");
  }
  refreshLeaderboard();
  // Only poll the leaderboard on screens that actually show it — this
  // used to run every 15s on every device even mid-round.
  setInterval(function(){
    if (state.screen === "register" || state.screen === "leaderboard") refreshLeaderboard();
  }, 15000);
  render();
})();
</script>
</body>
</html>
